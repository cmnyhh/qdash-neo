# qdash-neo 的插件声明行。
#
# 「安装 ≠ 启用」：这条 insert 是唯一真相源，不扫目录。
# 本地开发时 DSH 用 `--patch` 覆盖层追加同一行（见 docs/qdash-neo/05-施工计划.md），
# 装到 profile 里之后由本文件生效。
- insert:
    - id: qdash-neo
      # 必须与 package.json 的 name 完全一致：DSH 按这个名字 import 模块。
      # 改成 @cmnyhh/ 后忘了同步这里，装上去就是
      # "Cannot find package 'qdash-neo' imported from profiles/web/"，
      # 而日志里那行看着像依赖没装，其实是这里指错了。
      name: '@cmnyhh/qdash-neo'
