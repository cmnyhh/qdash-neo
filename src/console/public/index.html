<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>qdash-neo 控制台</title>
  <link rel="icon" href="assets/brand-mark.png" type="image/png" />
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <a class="skip-link" href="#view">跳到内容</a>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/brand-mark.png" alt="" width="30" height="30" onerror="this.style.display='none'" />
        </span>
        <div class="brand-text">
          <span class="brand-name">qdash-neo</span>
          <span class="brand-sub">控制台</span>
        </div>
      </div>

      <!-- 导航由 app.js 渲染：内置五项 + 插件通过 /api/tabs 注册的选项卡 -->
      <nav class="nav" id="nav" aria-label="主导航"></nav>

      <div class="sidebar-foot">
        <div class="row"><span>版本</span><span id="sidebar-version">v—</span></div>
        <div class="row"><span>挂载</span><span id="sidebar-mount">/qdash-neo</span></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs">
          <span id="crumb-section">总览</span>
          <span class="sep" aria-hidden="true">/</span>
          <strong id="crumb-title">运行状态</strong>
        </div>
        <div class="top-actions">
          <span class="conn">
            <span id="conn-dot" class="conn-dot" aria-hidden="true"></span>
            <span id="conn-name">连接中…</span>
          </span>
          <span id="refreshed-at" class="mono muted text-xs">—</span>
          <button id="refresh" class="btn btn-ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" />
            </svg>
            刷新
          </button>
          <button id="account" class="btn btn-ghost" type="button" title="修改访问口令">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /><path d="M12 14v2" />
            </svg>
            口令
          </button>
          <button id="logout" class="btn btn-ghost" type="button" title="退出登录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" />
            </svg>
            退出
          </button>
        </div>
      </header>

      <div class="content">
        <div id="banner" class="banner" hidden>
          <span id="banner-text"></span>
          <button id="banner-close" class="banner-close" type="button" aria-label="关闭提示">×</button>
        </div>
        <main id="view" tabindex="-1" aria-live="polite"></main>
      </div>

      <footer class="footer">
        <span id="footer-ready">—</span>
        <span aria-hidden="true">·</span>
        <span>配置改动保存后立即生效</span>
        <span class="grow"></span>
        <span id="footer-clock" class="mono">—</span>
      </footer>
    </div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
