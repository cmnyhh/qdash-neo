# 群场景 **真模型** overlay：给 dsh-base 里已挂载的 llm-pi-ai 配一条网关路由，
# 再插 qdash-neo 接假 OneBot（10 条群消息，第 1 条由**非私聊白名单成员** @ 机器人）。
#
# 为什么要单独一份（而不是改 group.patch.yml）：那份用假模型，验的是接线；
# 这份用真模型，验的是「真判定 + 真回答 + 配额」在同一条链上成立。
#
# 跑法见 scripts/group-real.ps1（需要 QDN_LLM_KEY 与 DSH_RUN 两个环境变量）。
#
# 关键事实（2026-10-26 实测）：`@deepseek-ai/dsh-llm-pi-ai` **已经在 dsh-base 里以 id
# `llm-pi-ai` 挂载**（dormant，零路由）。再 insert 一次会报
# `configurable provider "amazon-bedrock" is already declared`，
# 所以这里用 id 覆盖它的 config，而不是插入新实例。
#
# 密钥只走环境变量引用（pi-ai 只接受 apiKeyEnv），配置文件里绝不出现密钥。
- id: llm-pi-ai
  config:
    providers:
      qdn-gateway:
        displayName: 'QDN Gateway'
        apiKeyEnv: QDN_LLM_KEY
        api: openai-completions
        baseURL: 'https://api.example.com/v1'
        defaultContextWindow: 262144
        defaultMaxTokens: 8192
        timeoutMs: 120000
        models:
          # flash：判定实测 1.8~2.3s（pro 是 3.4~4.0s），10 条群消息的集成测试快一倍
          - id: deepseek-v4.1-flash
            name: Deepseek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 32768
          - id: deepseek-v4-pro
            name: Deepseek-V4-Pro
            contextWindow: 1000000
            maxTokens: 8192

- insert:
    - id: qdash-neo
      name: 'qdash-neo'
      config:
        onebot:
          wsUrl: 'ws://127.0.0.1:3999'
          token: ''
          selfId: '100000001'
        agent:
          provider: 'qdn-gateway'
          model: 'deepseek-v4.1-flash'
          preset: ''
        policy:
          # 白名单只约束私聊：第 1 条 @ 来自 20001（不在白名单），照样进判定并回复
          whitelist: ['10001']
          groupEnabled: true
          groupTrigger: 'judge'
          groupReplyQuota:
            windowMinutes: 10
            maxReplies: 3
          ratePerMinute: 100
        judge:
          enabled: true
          provider: 'qdn-gateway'
          # 判定用 flash：只需要一个 JSON，不必上大模型
          model: 'deepseek-v4.1-flash'
          # 真网关 + 推理模型：单次判定 2~15s，8s 会大面积超时
          timeoutMs: 20000
          # 推理预算：实测同一句闲聊一次花 250 token、另一次直接吃满 512；
          # 判定结果里还要带一句 memory，所以留 1280
          maxTokens: 1280
          threshold: 0.6
          maxPerMinute: 50
          contextLines: 20
          contextMaxChars: 3000
          contextTtlMinutes: 60
        # 长期记忆：集成测试里开着，验证 thought 真能写进 memories 表，
        # 且注入后不干扰「配额只回一条」的断言
        memory:
          enabled: true
          inject: true
          maxChars: 800
          thoughtTtlMinutes: 120
